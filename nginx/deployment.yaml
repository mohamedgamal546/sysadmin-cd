apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: e-com
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-front
  template:
    metadata:
      labels:
        app: nginx-front
    spec:
      containers:
        - name: nginx
          image: nginx:stable
          ports:
            - containerPort: 80
